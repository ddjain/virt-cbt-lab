apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __VM_NAME__
  namespace: __NAMESPACE__
  labels:
    cbt-demo: enabled
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
    virt-cbt-lab/pool: exp06
  annotations:
    virt-cbt-lab/os-profile: rhel9
    virt-cbt-lab/manifest-variant: default
    virt-cbt-lab/incremental-passes: "1"
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: __DV_NAME__
        labels:
          __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
          __RUN_ID_LABEL_KEY__: __RUN_ID__
      spec:
        sourceRef:
          kind: DataSource
          name: __DATA_SOURCE_NAME__
          namespace: __DATA_SOURCE_NAMESPACE__
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 80Gi
          storageClassName: cbt-demo-hpp
          volumeMode: Filesystem
    - metadata:
        name: __EXTRA_DV_NAME__
        labels:
          __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
          __RUN_ID_LABEL_KEY__: __RUN_ID__
      spec:
        source:
          blank: {}
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: cbt-demo-hpp
          volumeMode: Filesystem
  template:
    metadata:
      labels:
        cbt-demo: enabled
    spec:
      evictionStrategy: None
      domain:
        cpu:
          cores: 1
        memory:
          guest: 2Gi
        resources:
          requests:
            memory: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: datadisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: __DV_NAME__
        - name: datadisk
          dataVolume:
            name: __EXTRA_DV_NAME__
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              package_update: __GUEST_CLOUD_INIT_PACKAGE_UPDATE__
              packages: __GUEST_CLOUD_INIT_PACKAGES__
              runcmd:
                - [systemctl, enable, --now, qemu-guest-agent]
                - [systemctl, enable, --now, __GUEST_SSHD_SERVICE__]
                - [mkdir, -p, /mnt/datadisk]
                - |
                  #!/bin/bash
                  if ! blkid /dev/vdb; then
                    echo 'type=83' | sfdisk /dev/vdb
                    mkfs.ext4 -L datadisk /dev/vdb1
                  fi
                - [sh, -c, 'grep -q datadisk /etc/fstab || echo "LABEL=datadisk /mnt/datadisk ext4 defaults 0 2" >> /etc/fstab']
                - [mount, -a]
              ssh_pwauth: false
              users:
                - name: cbt-demo
                  gecos: CBT demo user
                  groups: [__GUEST_LINUX_GROUP__]
                  sudo: ["ALL=(ALL) NOPASSWD:ALL"]
                  shell: /bin/bash
                  lock_passwd: true
                  ssh_authorized_keys:
                    - __SSH_PUBLIC_KEY__
---
apiVersion: v1
kind: Service
metadata:
  name: __SSH_SERVICE__
  namespace: __NAMESPACE__
  labels:
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
spec:
  selector:
    vm.kubevirt.io/name: __VM_NAME__
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
