apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-cbt-restored
  namespace: vm-cbt-demo
  labels:
    vm-cbt-restore: enabled
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        vm-cbt-restore: enabled
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 2Gi
        resources:
          requests:
            memory: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: vm-cbt-restored-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              runcmd:
                - [systemctl, enable, --now, sshd]
              ssh_pwauth: false
              users:
                - name: cbt-demo
                  gecos: CBT demo user
                  groups: [wheel]
                  sudo: ["ALL=(ALL) NOPASSWD:ALL"]
                  shell: /bin/bash
                  lock_passwd: true
                  ssh_authorized_keys:
                    - __SSH_PUBLIC_KEY__
---
apiVersion: v1
kind: Service
metadata:
  name: vm-cbt-restored-ssh
  namespace: vm-cbt-demo
spec:
  selector:
    vm-cbt-restore: enabled
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
