apiVersion: v1
kind: Pod
metadata:
  name: __POD_NAME__
  namespace: __NAMESPACE__
  labels:
    cbt-demo-restore-verify: "true"
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
spec:
  restartPolicy: Never
  volumes:
    - name: full-backup
      persistentVolumeClaim:
        claimName: __FULL_PVC__
        readOnly: true
    - name: incremental-backup
      persistentVolumeClaim:
        claimName: __INCREMENTAL_PVC__
        readOnly: true
    - name: work
      emptyDir: {}
    - name: host-dev
      hostPath:
        path: /dev
        type: Directory
  containers:
    - name: restore-verify
      image: __HELPER_IMAGE__
      securityContext:
        privileged: true
      volumeMounts:
        - name: full-backup
          mountPath: /backups/full
          readOnly: true
        - name: incremental-backup
          mountPath: /backups/incremental
          readOnly: true
        - name: work
          mountPath: /work
        - name: host-dev
          mountPath: /dev
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail

          # Linux-visible mount-relative path corresponding to the guest
          # workload directory (C:\cbt-data\workload).
          workload_dir="__WORKLOAD_DIR__"
          active_loop=""
          active_mount=""

          cleanup_mount_and_loop() {
            if [[ -n "${active_mount:-}" ]]; then
              umount "$active_mount" >/dev/null 2>&1 || true
              active_mount=""
            fi
            if [[ -n "${active_loop:-}" ]]; then
              losetup -d "$active_loop" >/dev/null 2>&1 || true
              active_loop=""
            fi
          }

          cleanup() {
            local status=$?
            trap - EXIT
            set +e
            cleanup_mount_and_loop
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          full_qcow2="$(find /backups/full -type f -iname '*.qcow2' -print -quit 2>/dev/null || true)"
          incremental_qcow2="$(find /backups/incremental -type f -iname '*.qcow2' -print -quit 2>/dev/null || true)"
          if [[ -z "$full_qcow2" || ! -r "$full_qcow2" ]]; then
            printf 'ERROR: no readable qcow2 image found under /backups/full\n' >&2
            exit 1
          fi
          if [[ -z "$incremental_qcow2" || ! -r "$incremental_qcow2" ]]; then
            printf 'ERROR: no readable qcow2 image found under /backups/incremental\n' >&2
            exit 1
          fi

          if ! qemu-img convert -f qcow2 -O raw "$full_qcow2" /work/full.raw; then
            printf 'ERROR: failed to convert the full qcow2 image to raw\n' >&2
            exit 1
          fi

          cp "$incremental_qcow2" /work/incremental.qcow2
          if ! qemu-img rebase -b "$full_qcow2" -F qcow2 -f qcow2 -u /work/incremental.qcow2; then
            printf 'ERROR: failed to rebase the incremental qcow2 image onto the full image\n' >&2
            exit 1
          fi
          if ! qemu-img convert -f qcow2 -O raw /work/incremental.qcow2 /work/combined.raw; then
            printf 'ERROR: failed to convert the rebased incremental image to raw\n' >&2
            exit 1
          fi

          inspect_ntfs_workload() {
            local raw_image="$1" label="$2" loop_dev partition="" partition_size=0
            local candidate size fstype type mount_dir mounted_dir entries entry name
            local size_bytes sha256 record file_count=0 total_bytes=0 manifest_rows=""

            if [[ ! -r "$raw_image" ]]; then
              printf 'ERROR: raw restore image is missing or unreadable: %s\n' "$raw_image" >&2
              return 1
            fi
            loop_dev="$(losetup -fP --show "$raw_image")" || {
              printf 'ERROR: could not attach raw restore image with losetup: %s\n' "$raw_image" >&2
              return 1
            }
            active_loop="$loop_dev"
            udevadm settle --timeout=5 >/dev/null 2>&1 || sleep 1

            while read -r candidate size type; do
              [[ "$type" == "part" ]] || continue
              fstype="$(lsblk -no FSTYPE "$candidate" 2>/dev/null || true)"
              if [[ "${fstype,,}" != ntfs* ]]; then
                fstype="$(blkid -o value -s TYPE "$candidate" 2>/dev/null || true)"
              fi
              [[ "${fstype,,}" == ntfs* ]] || continue
              if [[ -z "$partition" || "$size" -gt "$partition_size" ]]; then
                partition="$candidate"
                partition_size="$size"
              fi
            done < <(lsblk -bpnro NAME,SIZE,TYPE "$loop_dev" 2>/dev/null || true)

            if [[ -z "$partition" ]]; then
              printf 'ERROR: no NTFS partition found in raw restore image: %s\n' "$raw_image" >&2
              return 1
            fi

            mount_dir="/work/$(printf '%s' "$label" | tr '[:upper:]' '[:lower:]')-mount"
            mkdir -p "$mount_dir"
            active_mount="$mount_dir"
            if ! mount -t ntfs3 -o ro "$partition" "$mount_dir"; then
              if ! ntfs-3g -o ro "$partition" "$mount_dir"; then
                printf 'ERROR: could not mount NTFS partition read-only: %s\n' "$partition" >&2
                return 1
              fi
            fi
            mounted_dir="$mount_dir$workload_dir"
            if [[ ! -d "$mounted_dir" ]]; then
              printf 'ERROR: workload directory %s is missing from %s restore\n' "$workload_dir" "$label" >&2
              return 1
            fi
            entry="$(find "$mounted_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
            if [[ -n "$entry" ]]; then
              printf 'ERROR: unexpected non-file workload entry in %s restore: %s\n' "$label" "$entry" >&2
              return 1
            fi
            entries="$(find "$mounted_dir" -mindepth 1 -maxdepth 1 -type f -print | LC_ALL=C sort)"
            while IFS= read -r entry; do
              [[ -n "$entry" ]] || continue
              name="${entry##*/}"
              if [[ ! "$name" =~ ^(base|incremental)-[0-9]{6}[.]dat$ ]]; then
                printf 'ERROR: unexpected workload filename in %s restore: %s\n' "$label" "$name" >&2
                return 1
              fi
              size_bytes="$(stat -c '%s' "$entry")"
              sha256="$(sha256sum "$entry" | awk '{print $1}')"
              printf -v record '%s\t%s\t%s\n' "$name" "$size_bytes" "$sha256"
              manifest_rows+="$record"
              file_count=$((file_count + 1))
              total_bytes=$((total_bytes + size_bytes))
            done <<< "$entries"
            if ((file_count == 0)); then
              printf 'ERROR: workload directory is empty in %s restore\n' "$label" >&2
              return 1
            fi
            sha256="$(printf '%s' "$manifest_rows" | sha256sum | awk '{print $1}')"
            cleanup_mount_and_loop
            printf '%s_WORKLOAD_FILE_COUNT=%s\n' "$label" "$file_count"
            printf '%s_WORKLOAD_PAYLOAD_BYTES=%s\n' "$label" "$total_bytes"
            printf '%s_WORKLOAD_MANIFEST_SHA256=%s\n' "$label" "$sha256"
          }

          inspect_ntfs_workload /work/full.raw FULL
          inspect_ntfs_workload /work/combined.raw COMBINED
