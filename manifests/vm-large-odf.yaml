# LARGE-ODF VARIANT — opt-in via MANIFEST_VARIANT=large-odf (see .env.example).
# Same chaos-testing sizing intent as vm-large.yaml, but backed by
# ocs-storagecluster-ceph-rbd instead of cbt-demo-hpp; the root disk request
# carries the same +20% margin used in vm-odf.yaml, since Ceph RBD enforces
# PVC capacity strictly and CDI's clone-time overhead inflates the actual
# disk past the nominal request (see docs/odf-setup-plan.md). Requires
# ODF/Ceph deployed on the cluster first. Keep structurally identical to
# vm-large.yaml (only storage class and sizes differ) so
# scripts/vm-setup.sh's sed pipeline works unchanged.
apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __VM_NAME__
  namespace: __NAMESPACE__
  labels:
    cbt-demo: enabled
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: __DV_NAME__
        labels:
          __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
          __RUN_ID_LABEL_KEY__: __RUN_ID__
      spec:
        sourceRef:
          kind: DataSource
          name: debian
          namespace: vm-cbt-images
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 48Gi
          storageClassName: ocs-storagecluster-ceph-rbd
          volumeMode: Filesystem
  template:
    metadata:
      labels:
        cbt-demo: enabled
    spec:
      evictionStrategy: None
      domain:
        cpu:
          cores: 1
        memory:
          guest: 4Gi
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: __DV_NAME__
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              package_update: true
              packages:
                - qemu-guest-agent
              runcmd:
                - [systemctl, enable, --now, qemu-guest-agent]
                - [systemctl, enable, --now, ssh]
              ssh_pwauth: false
              users:
                - name: cbt-demo
                  gecos: CBT demo user
                  groups: [sudo]
                  sudo: ["ALL=(ALL) NOPASSWD:ALL"]
                  shell: /bin/bash
                  lock_passwd: true
                  ssh_authorized_keys:
                    - __SSH_PUBLIC_KEY__
---
apiVersion: v1
kind: Service
metadata:
  name: __SSH_SERVICE__
  namespace: __NAMESPACE__
  labels:
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
spec:
  selector:
    vm.kubevirt.io/name: __VM_NAME__
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
