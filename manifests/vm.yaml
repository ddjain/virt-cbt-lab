apiVersion: v1
kind: Namespace
metadata:
  name: vm-cbt-demo
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-cbt-demo
  namespace: vm-cbt-demo
  labels:
    cbt-demo: enabled
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: vm-cbt-root
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 30Gi
          storageClassName: cbt-demo-hpp
          volumeMode: Filesystem
  template:
    metadata:
      labels:
        cbt-demo: enabled
    spec:
      evictionStrategy: None
      domain:
        cpu:
          cores: 1
        memory:
          guest: 2Gi
        resources:
          requests:
            memory: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: vm-cbt-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              runcmd:
                - [systemctl, enable, --now, sshd]
              ssh_pwauth: false
              users:
                - name: cbt-demo
                  gecos: CBT demo user
                  groups: [wheel]
                  sudo: ["ALL=(ALL) NOPASSWD:ALL"]
                  shell: /bin/bash
                  lock_passwd: true
                  ssh_authorized_keys:
                    - __SSH_PUBLIC_KEY__
---
apiVersion: v1
kind: Service
metadata:
  name: vm-cbt-ssh
  namespace: vm-cbt-demo
spec:
  selector:
    vm.kubevirt.io/name: vm-cbt-demo
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
