apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: __INCREMENTAL_BACKUP_PVC__
  namespace: __NAMESPACE__
  labels:
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
spec:
  # ODF Ceph RBD Filesystem destination (plain ceph-rbd class, as documented
  # for Windows backup PVCs). Ceph RBD enforces PVC capacity strictly; the
  # claim is sized by INCREMENTAL_PVC_SIZE (30Gi default), which must exceed
  # the peak changed-block payload of a pass.
  storageClassName: ocs-storagecluster-ceph-rbd
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: __INCREMENTAL_PVC_SIZE__
---
apiVersion: backup.kubevirt.io/v1alpha1
kind: VirtualMachineBackup
metadata:
  name: __INCREMENTAL_BACKUP_NAME__
  namespace: __NAMESPACE__
  labels:
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
spec:
  source:
    apiGroup: backup.kubevirt.io
    kind: VirtualMachineBackupTracker
    name: __TRACKER_NAME__
  pvcName: __INCREMENTAL_BACKUP_PVC__
