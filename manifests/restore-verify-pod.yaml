apiVersion: v1
kind: Pod
metadata:
  name: __POD_NAME__
  namespace: __NAMESPACE__
  labels:
    cbt-demo-restore-verify: "true"
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
spec:
  restartPolicy: Never
  volumes:
    - name: full-backup
      persistentVolumeClaim:
        claimName: __FULL_PVC__
        readOnly: true
    # __INCREMENTAL_VOLUMES__
    - name: work
      emptyDir: {}
    - name: host-dev
      hostPath:
        path: /dev
        type: Directory
    - name: host-modules
      hostPath:
        path: /lib/modules
        type: Directory
  containers:
    - name: restore-verify
      image: __HELPER_IMAGE__
      securityContext:
        privileged: true
      volumeMounts:
        - name: full-backup
          mountPath: /backups/full
          readOnly: true
        # __INCREMENTAL_MOUNTS__
        - name: work
          mountPath: /work
        - name: host-dev
          mountPath: /dev
        - name: host-modules
          mountPath: /lib/modules
          readOnly: true
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          workload_dir="__WORKLOAD_DIR__"
          active_loop=""
          active_mount=""
          active_nbd=""
          attached_kind=""
          attached_dev=""
          attached_raw=""
          convert_pid=""

          cleanup_restore() {
            local status=$?
            trap - EXIT
            set +e
            if [[ -n "$convert_pid" ]]; then
              wait "$convert_pid" 2>/dev/null
              convert_pid=""
            fi
            if [[ -n "$active_mount" ]]; then umount "$active_mount" >/dev/null 2>&1; fi
            if [[ -n "$active_loop" ]]; then losetup -d "$active_loop" >/dev/null 2>&1; fi
            if [[ -n "$active_nbd" ]]; then qemu-nbd --disconnect "$active_nbd" >/dev/null 2>&1; fi
            exit "$status"
          }
          trap cleanup_restore EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # qemu-nbd binds a lock file under /run/lock (/var/lock is a symlink
          # to it in the helper image); create it so the NBD fast path can be
          # used when the node makes the nbd module available.
          mkdir -p /run/lock 2>/dev/null || true

          # Bound the hash fan-out: enough parallelism to saturate the read
          # path, without spawning a worker per core on very large nodes.
          hash_jobs() {
            local cores
            cores="$(nproc 2>/dev/null || echo 2)"
            if ((cores > 16)); then cores=16; fi
            if ((cores < 1)); then cores=1; fi
            printf '%s' "$cores"
          }

          # Backup filenames end in -<VM volume name>.qcow2. Only rootdisk
          # carries the workflow manifest; other disks need separate grading.
          select_rootdisk_image() {
            local directory="$1" listing image
            local -a images=()
            listing="$(find "$directory" -type f -name '*-rootdisk.qcow2' -print)" || return 1
            while IFS= read -r image; do
              [[ -z "$image" ]] || images+=("$image")
            done <<< "$listing"
            if ((${#images[@]} != 1)); then
              printf 'ERROR: expected one rootdisk qcow2 under %s, found %s\n' "$directory" "${#images[@]}" >&2
              return 1
            fi
            printf '%s\n' "${images[0]}"
          }
          full_qcow2="$(select_rootdisk_image /backups/full)"
          incremental_dirs=()
          if [[ -d /backups/incrementals ]]; then
            mapfile -t incremental_dirs < <(find /backups/incrementals -mindepth 1 -maxdepth 1 -type d -name 'p[0-9][0-9]' | LC_ALL=C sort)
          fi
          expected_incremental_count="__INCREMENTAL_COUNT__"
          if ((${#incremental_dirs[@]} != expected_incremental_count)); then
            printf 'ERROR: expected %s incremental PVC mount(s), found %s\n' \
              "$expected_incremental_count" "${#incremental_dirs[@]}" >&2
            exit 1
          fi
          echo "FULL_QCOW2=$full_qcow2"

          # Attach a qcow2 image (with its backing chain) and print the block
          # device that exposes it, or fail. Two mechanisms, in order:
          #   1. qemu-nbd: exposes the qcow2 chain directly, so no full-size
          #      raw intermediate has to be written. Needs the nbd kernel
          #      module in the host kernel.
          #   2. qemu-img convert to a raw file + losetup: always available.
          # Both paths mount the same read-only filesystem and run the same
          # hash comparison, so the verification result is identical.
          probe_nbd() {
            local candidate partition
            command -v qemu-nbd >/dev/null 2>&1 || return 1
            if command -v modprobe >/dev/null 2>&1; then
              modprobe nbd >/dev/null 2>&1 || true
            fi
            rm -f /work/nbd-probe.qcow2
            qemu-img create -f qcow2 -b "$full_qcow2" -F qcow2 /work/nbd-probe.qcow2 >/dev/null 2>&1 || return 1
            for candidate in /dev/nbd0 /dev/nbd1 /dev/nbd2 /dev/nbd3 /dev/nbd4 /dev/nbd5 /dev/nbd6 /dev/nbd7; do
              [[ -b "$candidate" ]] || continue
              if ! qemu-nbd --connect="$candidate" --fork /work/nbd-probe.qcow2 >/dev/null 2>&1; then
                continue
              fi
              udevadm settle --timeout=5 >/dev/null 2>&1 || sleep 1
              partition="$(lsblk -blnpo NAME,SIZE "$candidate" 2>/dev/null | tail -n +2 | sort -k2 -n | tail -n1 | awk '{print $1}')"
              qemu-nbd --disconnect "$candidate" >/dev/null 2>&1 || true
              if [[ -n "$partition" ]]; then
                nbd_candidate="$candidate"
                return 0
              fi
            done
            return 1
          }
          nbd_candidate=""
          nbd_available=false
          if probe_nbd; then
            nbd_available=true
          fi
          printf 'RESTORE_MOUNT_MODE=%s\n' "$([[ "$nbd_available" == true ]] && printf nbd || printf convert)"

          attach_image() {
            local image="$1" label="$2" raw snap
            attached_kind=""
            attached_dev=""
            attached_raw=""
            if [[ "$nbd_available" == true ]]; then
              # A CBT backup is taken from a running guest, so the captured
              # filesystem may still need journal replay before it can be
              # mounted. Expose a writable snapshot overlay instead of a
              # read-only device: the overlay absorbs those writes and the
              # backup PVCs stay mounted read-only.
              snap="/work/${label,,}-nbd-overlay.qcow2"
              rm -f "$snap"
              if qemu-img create -f qcow2 -b "$image" -F qcow2 "$snap" >/dev/null 2>&1; then
                qemu-nbd --disconnect "$nbd_candidate" >/dev/null 2>&1 || true
                if qemu-nbd --connect="$nbd_candidate" --fork "$snap" >/dev/null 2>&1; then
                  udevadm settle --timeout=5 >/dev/null 2>&1 || sleep 1
                  active_nbd="$nbd_candidate"
                  attached_kind="nbd"
                  attached_dev="$nbd_candidate"
                  return 0
                fi
                qemu-nbd --disconnect "$nbd_candidate" >/dev/null 2>&1 || true
              fi
              printf 'WARN: qemu-nbd attach failed for %s; using qemu-img convert for this image\n' "$label" >&2
              nbd_available=false
            fi
            raw="/work/${label,,}.raw"
            qemu-img convert -f qcow2 -O raw "$image" "$raw"
            attached_kind="loop"
            attached_raw="$raw"
            attached_dev="$(losetup -fP --show "$raw")"
            active_loop="$attached_dev"
          }

          detach_image() {
            if [[ -n "$active_mount" ]]; then
              umount "$active_mount" >/dev/null 2>&1 || true
              active_mount=""
            fi
            if [[ "$attached_kind" == nbd && -n "$active_nbd" ]]; then
              qemu-nbd --disconnect "$active_nbd" >/dev/null 2>&1 || true
              active_nbd=""
            elif [[ -n "$active_loop" ]]; then
              losetup -d "$active_loop" >/dev/null 2>&1 || true
              active_loop=""
            fi
            if [[ -n "$attached_raw" ]]; then
              rm -f "$attached_raw"
            fi
            attached_kind=""
            attached_dev=""
            attached_raw=""
          }

          # Inspect one image, retrying with the always-available convert path
          # when the NBD mount cannot be used. A structural read failure (for
          # example a missing workload directory) fails in both paths, so the
          # retry cannot turn a real verification failure into a pass.
          inspect_image() {
            local image="$1" label="$2"
            if [[ "$nbd_available" == true ]]; then
              attach_image "$image" "$label"
              if inspect_workload "$attached_dev" "$label"; then
                detach_image
                return 0
              fi
              detach_image
              printf 'WARN: NBD read of %s failed; retrying this image with qemu-img convert\n' "$label" >&2
              nbd_available=false
            fi
            attach_image "$image" "$label"
            inspect_workload "$attached_dev" "$label"
            detach_image
          }

          # Read the guest workload directory from the restored disk and print
          # the file count, payload size, and manifest digest. Partitions are
          # tried largest-first until one mounts and contains the workload
          # directory; names are validated first, then sizes come from one
          # batched stat and hashes from a parallel sha256sum fan-out, so a
          # 1000-file workload no longer forks one process per file.
          inspect_workload() {
            local device="$1" label="$2"
            local part mount_dir mounted_dir entry name candidate mounted_partition="" probed=false
            local sizes_file hashes_file file_count total_bytes manifest_rows digest cores
            local -a candidates=()
            udevadm settle --timeout=5 2>/dev/null || sleep 1
            mapfile -t candidates < <(lsblk -blnpo NAME,SIZE "$device" 2>/dev/null \
              | tail -n +2 | sort -k2 -n -r | awk '{print $1}')
            if ((${#candidates[@]} == 0)); then
              echo "ERROR: could not find a partition in $label image" >&2
              return 1
            fi
            mount_dir="/work/${label,,}-mount"
            mkdir -p "$mount_dir"
            for candidate in "${candidates[@]}"; do
              probed=true
              if ! mount -o ro "$candidate" "$mount_dir" 2>/dev/null; then
                continue
              fi
              if [[ -d "$mount_dir$workload_dir" ]]; then
                mounted_partition="$candidate"
                active_mount="$mount_dir"
                break
              fi
              # Not the guest root filesystem (for example an EFI or boot
              # partition); try the next candidate.
              umount "$mount_dir" >/dev/null 2>&1 || true
            done
            if [[ -z "$mounted_partition" ]]; then
              if [[ "$probed" == true ]]; then
                echo "ERROR: no partition with $workload_dir found in $label restore" >&2
              fi
              return 1
            fi
            printf 'RESTORE_PARTITION_%s=%s\n' "$label" "$mounted_partition"
            mounted_dir="$mount_dir$workload_dir"
            entry="$(find "$mounted_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
            if [[ -n "$entry" ]]; then
              echo "ERROR: unexpected non-file workload entry in $label restore: $entry" >&2
              return 1
            fi
            while IFS= read -r entry; do
              [[ -n "$entry" ]] || continue
              name="${entry##*/}"
              if [[ ! "$name" =~ ^(base-[0-9]{6}|incremental-[0-9]{2}-[0-9]{6})[.]dat$ ]]; then
                echo "ERROR: unexpected workload filename in $label restore: $name" >&2
                return 1
              fi
            done < <(find "$mounted_dir" -mindepth 1 -maxdepth 1 -type f -print | LC_ALL=C sort)
            sizes_file="/work/${label,,}-sizes.txt"
            hashes_file="/work/${label,,}-hashes.txt"
            find "$mounted_dir" -mindepth 1 -maxdepth 1 -type f -print | LC_ALL=C sort \
              | xargs -d '\n' stat -c '%n %s' > "$sizes_file"
            if [[ ! -s "$sizes_file" ]]; then
              echo "ERROR: workload directory is empty in $label restore" >&2
              return 1
            fi
            cores="$(hash_jobs)"
            find "$mounted_dir" -mindepth 1 -maxdepth 1 -type f -print | LC_ALL=C sort \
              | xargs -d '\n' -P "$cores" -n 32 sha256sum > "$hashes_file"
            manifest_rows="$(awk 'FILENAME==ARGV[1] { hash[$2]=$1; next } { p=$1; sub(/.*\//, "", p); printf "%s\t%s\t%s\n", p, $2, hash[$1] }' \
              "$hashes_file" "$sizes_file" | LC_ALL=C sort)"
            file_count="$(wc -l < "$sizes_file")"
            total_bytes="$(awk '{sum += $2} END {print sum + 0}' "$sizes_file")"
            digest="$(printf '%s\n' "$manifest_rows" | sha256sum | awk '{print $1}')"
            rm -f "$sizes_file" "$hashes_file"
            umount "$mount_dir"
            active_mount=""
            printf '%s_WORKLOAD_FILE_COUNT=%s\n' "$label" "$file_count"
            printf '%s_WORKLOAD_PAYLOAD_BYTES=%s\n' "$label" "$total_bytes"
            printf '%s_WORKLOAD_MANIFEST_SHA256=%s\n' "$label" "$digest"
          }

          # Each incremental qcow2 records a backing path from the pod that
          # produced the backup, so a writable copy is rebased onto the
          # preceding checkpoint before it is read here.
          overlay_paths=()
          base_qcow2="$full_qcow2"
          expected_pass=1
          for incremental_dir in "${incremental_dirs[@]}"; do
            pass_name="${incremental_dir##*/}"
            printf -v expected_name 'p%02d' "$expected_pass"
            if [[ "$pass_name" != "$expected_name" ]]; then
              printf 'ERROR: expected incremental mount %s, found %s\n' "$expected_name" "$pass_name" >&2
              exit 1
            fi
            pass_qcow2="$(select_rootdisk_image "$incremental_dir")"
            overlay="/work/${pass_name}.qcow2"
            cp "$pass_qcow2" "$overlay"
            qemu-img rebase -b "$base_qcow2" -F qcow2 -f qcow2 -u "$overlay"
            overlay_paths+=("$overlay")
            base_qcow2="$overlay"
            expected_pass=$((expected_pass + 1))
          done

          start_convert() {
            qemu-img convert -f qcow2 -O raw "$1" "$2" &
            convert_pid=$!
          }
          await_convert() {
            if [[ -n "$convert_pid" ]]; then
              wait "$convert_pid"
              convert_pid=""
            fi
          }

          if [[ "$nbd_available" == true ]]; then
            # The qcow2 chain is exposed through qemu-nbd; there is nothing to
            # convert. A per-image failure falls back to the convert path.
            inspect_image "$full_qcow2" FULL
            expected_pass=1
            for overlay in "${overlay_paths[@]}"; do
              printf -v pass_label '%02d' "$expected_pass"
              inspect_image "$overlay" "PASS_$pass_label"
              expected_pass=$((expected_pass + 1))
            done
          else
            # Convert the next image while the current one is inspected, so
            # the hash pass overlaps the next raw conversion.
            images=("$full_qcow2" "${overlay_paths[@]}")
            labels=(FULL)
            expected_pass=1
            for overlay in "${overlay_paths[@]}"; do
              printf -v pass_label '%02d' "$expected_pass"
              labels+=("PASS_$pass_label")
              expected_pass=$((expected_pass + 1))
            done
            start_convert "${images[0]}" "/work/${labels[0],,}.raw"
            for ((index = 0; index < ${#images[@]}; index++)); do
              await_convert
              next=$((index + 1))
              if ((next < ${#images[@]})); then
                start_convert "${images[$next]}" "/work/${labels[$next],,}.raw"
              fi
              raw="/work/${labels[$index],,}.raw"
              active_loop="$(losetup -fP --show "$raw")"
              attached_kind="loop"
              attached_dev="$active_loop"
              attached_raw="$raw"
              inspect_workload "$attached_dev" "${labels[$index]}"
              detach_image
            done
          fi
