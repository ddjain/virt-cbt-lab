apiVersion: v1
kind: Pod
metadata:
  name: __POD_NAME__
  namespace: __NAMESPACE__
  labels:
    cbt-demo-restore-verify: "true"
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
spec:
  restartPolicy: Never
  volumes:
    - name: full-backup
      persistentVolumeClaim:
        claimName: __FULL_PVC__
        readOnly: true
    - name: incremental-backup
      persistentVolumeClaim:
        claimName: __INCREMENTAL_PVC__
        readOnly: true
    - name: work
      emptyDir: {}
    - name: host-dev
      hostPath:
        path: /dev
        type: Directory
  containers:
    - name: restore-verify
      image: __HELPER_IMAGE__
      securityContext:
        privileged: true
      volumeMounts:
        - name: full-backup
          mountPath: /backups/full
          readOnly: true
        - name: incremental-backup
          mountPath: /backups/incremental
          readOnly: true
        - name: work
          mountPath: /work
        - name: host-dev
          mountPath: /dev
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          workload_dir="__WORKLOAD_DIR__"
          active_loop=""
          active_mount=""

          cleanup_restore() {
            local status=$?
            trap - EXIT
            set +e
            if [[ -n "$active_mount" ]]; then umount "$active_mount" >/dev/null 2>&1; fi
            if [[ -n "$active_loop" ]]; then losetup -d "$active_loop" >/dev/null 2>&1; fi
            exit "$status"
          }
          trap cleanup_restore EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          full_qcow2="$(find /backups/full -name '*.qcow2' | head -n1)"
          incremental_qcow2="$(find /backups/incremental -name '*.qcow2' | head -n1)"
          if [[ -z "$full_qcow2" ]]; then
            echo "ERROR: no qcow2 file found under /backups/full" >&2
            exit 1
          fi
          if [[ -z "$incremental_qcow2" ]]; then
            echo "ERROR: no qcow2 file found under /backups/incremental" >&2
            exit 1
          fi
          echo "FULL_QCOW2=$full_qcow2"
          echo "INCREMENTAL_QCOW2=$incremental_qcow2"

          qemu-img convert -f qcow2 -O raw "$full_qcow2" /work/full.raw
          cp "$incremental_qcow2" /work/incremental.qcow2
          qemu-img rebase -b "$full_qcow2" -F qcow2 -f qcow2 -u /work/incremental.qcow2
          qemu-img convert -f qcow2 -O raw /work/incremental.qcow2 /work/combined.raw

          inspect_workload() {
            local raw_image="$1" label="$2" loop_dev part mount_dir mounted_dir entries entry name size_bytes sha256 record
            local file_count=0 total_bytes=0 manifest_rows=""
            loop_dev="$(losetup -fP --show "$raw_image")"
            active_loop="$loop_dev"
            udevadm settle --timeout=5 2>/dev/null || sleep 1
            part="$(lsblk -blnpo NAME,SIZE "$loop_dev" | tail -n +2 | sort -k2 -n | tail -n1 | awk '{print $1}')"
            if [[ -z "$part" ]]; then
              echo "ERROR: could not find the ext4 root partition in $raw_image" >&2
              return 1
            fi
            mount_dir="/work/${label,,}-mount"
            mkdir -p "$mount_dir"
            mount -o ro "$part" "$mount_dir"
            active_mount="$mount_dir"
            mounted_dir="$mount_dir$workload_dir"
            if [[ ! -d "$mounted_dir" ]]; then
              echo "ERROR: workload directory $workload_dir is missing from $label restore" >&2
              return 1
            fi
            entry="$(find "$mounted_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
            if [[ -n "$entry" ]]; then
              echo "ERROR: unexpected non-file workload entry in $label restore: $entry" >&2
              return 1
            fi
            entries="$(find "$mounted_dir" -mindepth 1 -maxdepth 1 -type f -print | LC_ALL=C sort)"
            while IFS= read -r entry; do
              [[ -n "$entry" ]] || continue
              name="${entry##*/}"
              if [[ ! "$name" =~ ^(base|incremental)-[0-9]{6}[.]dat$ ]]; then
                echo "ERROR: unexpected workload filename in $label restore: $name" >&2
                return 1
              fi
              size_bytes="$(stat -c '%s' "$entry")"
              sha256="$(sha256sum "$entry" | awk '{print $1}')"
              printf -v record '%s\t%s\t%s\n' "$name" "$size_bytes" "$sha256"
              manifest_rows+="$record"
              file_count=$((file_count + 1))
              total_bytes=$((total_bytes + size_bytes))
            done <<< "$entries"
            if ((file_count == 0)); then
              echo "ERROR: workload directory is empty in $label restore" >&2
              return 1
            fi
            sha256="$(printf '%s' "$manifest_rows" | sha256sum | awk '{print $1}')"
            umount "$mount_dir"
            active_mount=""
            losetup -d "$loop_dev"
            active_loop=""
            printf '%s_WORKLOAD_FILE_COUNT=%s\n' "$label" "$file_count"
            printf '%s_WORKLOAD_PAYLOAD_BYTES=%s\n' "$label" "$total_bytes"
            printf '%s_WORKLOAD_MANIFEST_SHA256=%s\n' "$label" "$sha256"
          }

          inspect_workload /work/full.raw FULL
          inspect_workload /work/combined.raw COMBINED
