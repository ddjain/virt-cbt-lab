# DENSITY RHEL 9 VM template for kube-burner (`make density-setup`), used for
# VM_OS=rhel9 and rhel9-light (os-profile, golden PVC name, and disk size
# come from the density-setup user-data). Keep structurally in
# sync with manifests/vm-large-odf.yaml (cloud-init hard-coded for the RHEL
# profiles: package_update false, no packages, wheel group, sshd service).
# Namespace comes from manifests/density/config.yaml, so no Namespace
# document here.
#
# 2026-11-22 — same-namespace PVC clone (no DataVolume/CDI): the root disk
# is a plain PVC whose dataSource is a golden PVC copied into
# {{ .namespace }} by scripts/density-setup.sh (CLONE_SRC_PVC). This avoids
# CDI's cross-namespace clone bridge (per-clone expiring JWTs + tmp-pvc
# churn + double ceph clone through one throttled CSI provisioner), which
# wedged a 2000-VM build for hours on 2026-11-22. The VM references the PVC
# directly; PVC Bound → VM boots. The golden PVC must not be smaller than
# diskSize (clone floor). The golden PVC carries virt-cbt-lab/golden=true
# and is named golden-<osProfile>; wipe tooling matches vm-disk-* /
# persistent-state-* prefixes, so it is never deleted.
# $rid is re-declared per document; Go-template variables do not cross
# document boundaries.
{{ $rid := printf "%s-%04d" .poolId (add (atoi .startIndex) (add1 .Iteration)) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-disk-{{ $rid }}
  namespace: {{ .namespace }}
  labels:
    cbt-demo: enabled
    {{ .managedByKey }}: {{ .managedByValue }}
    {{ .runIdKey }}: {{ $rid }}
    {{ .poolKey }}: {{ .poolId }}
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: {{ .storageClass }}
  dataSource:
    apiGroup: ""
    kind: PersistentVolumeClaim
    name: {{ .cloneSrcPvc }}
  resources:
    requests:
      storage: {{ .diskSize }}
---
{{ $rid := printf "%s-%04d" .poolId (add (atoi .startIndex) (add1 .Iteration)) }}
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-{{ $rid }}
  namespace: {{ .namespace }}
  labels:
    cbt-demo: enabled
    {{ .managedByKey }}: {{ .managedByValue }}
    {{ .runIdKey }}: {{ $rid }}
    {{ .poolKey }}: {{ .poolId }}
  annotations:
    virt-cbt-lab/os-profile: {{ .osProfile | default "rhel9" }}
    virt-cbt-lab/manifest-variant: "{{ .manifestVariant }}"
    virt-cbt-lab/incremental-passes: "{{ .incrementalPasses }}"
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        cbt-demo: enabled
    spec:
      evictionStrategy: None
      domain:
        cpu:
          cores: 1
        memory:
          guest: 4Gi
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: vm-disk-{{ $rid }}
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              package_update: false
              packages: []
              runcmd:
                - [systemctl, enable, --now, qemu-guest-agent]
                - [systemctl, enable, --now, sshd]
              ssh_pwauth: false
              users:
                - name: cbt-demo
                  gecos: CBT demo user
                  groups: [wheel]
                  sudo: ["ALL=(ALL) NOPASSWD:ALL"]
                  shell: /bin/bash
                  lock_passwd: true
                  ssh_authorized_keys:
                    - {{ .sshPublicKey }}
---
{{ $rid := printf "%s-%04d" .poolId (add (atoi .startIndex) (add1 .Iteration)) }}
apiVersion: v1
kind: Service
metadata:
  name: vm-ssh-{{ $rid }}
  namespace: {{ .namespace }}
  labels:
    {{ .managedByKey }}: {{ .managedByValue }}
    {{ .runIdKey }}: {{ $rid }}
    {{ .poolKey }}: {{ .poolId }}
spec:
  selector:
    vm.kubevirt.io/name: vm-{{ $rid }}
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
