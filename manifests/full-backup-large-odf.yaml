# LARGE-ODF VARIANT — opt-in via MANIFEST_VARIANT=large-odf (see .env.example).
# Same chaos-testing sizing intent as full-backup-large.yaml, but backed by
# ocs-storagecluster-ceph-rbd instead of cbt-demo-hpp. `__LARGE_DISK_SIZE__`
# is resolved by scripts/common.sh to 48Gi for Debian or 80Gi for RHEL 9.
# Ceph RBD enforces PVC capacity strictly; see docs/odf-setup-plan.md.
# Requires ODF/Ceph deployed first. Keep structurally identical to
# full-backup-large.yaml (only storage class and sizes differ) so the
# scripts/vm-backup.sh sed pipeline works unchanged.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: __FULL_BACKUP_PVC__
  namespace: __NAMESPACE__
  labels:
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
spec:
  storageClassName: ocs-storagecluster-ceph-rbd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: __LARGE_DISK_SIZE__
---
apiVersion: backup.kubevirt.io/v1alpha1
kind: VirtualMachineBackupTracker
metadata:
  name: __TRACKER_NAME__
  namespace: __NAMESPACE__
  labels:
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
spec:
  source:
    apiGroup: kubevirt.io
    kind: VirtualMachine
    name: __VM_NAME__
---
apiVersion: backup.kubevirt.io/v1alpha1
kind: VirtualMachineBackup
metadata:
  name: __FULL_BACKUP_NAME__
  namespace: __NAMESPACE__
  labels:
    __MANAGED_BY_KEY__: __MANAGED_BY_VALUE__
    __RUN_ID_LABEL_KEY__: __RUN_ID__
spec:
  source:
    apiGroup: backup.kubevirt.io
    kind: VirtualMachineBackupTracker
    name: __TRACKER_NAME__
  pvcName: __FULL_BACKUP_PVC__
