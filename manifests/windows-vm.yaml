apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __VM_NAME__
  namespace: __NAMESPACE__
  labels:
    cbt-demo: enabled
    app.kubernetes.io/managed-by: __MANAGED_BY_VALUE__
    virt-cbt-lab/run-id: __RUN_ID__
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: __DV_NAME__
        labels:
          app.kubernetes.io/managed-by: __MANAGED_BY_VALUE__
          virt-cbt-lab/run-id: __RUN_ID__
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
      spec:
        sourceRef:
          kind: DataSource
          name: windows-server-2022
          namespace: vm-cbt-images
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 60Gi
          # ODF Ceph RBD (ocs-storagecluster-ceph-rbd-virtualization): the
          # same storage class as the windows-golden DataSource PVC, so the
          # root disk smart-clones from the golden instead of copying
          # cross-class. The HPP pool (cbt-demo-hpp on d38-h18-000-r660) was
          # for node-io-hog co-location experiments (EXP-9); ODF moves the
          # data path onto Ceph, so those scenarios no longer contend on the
          # node-local disk. 60Gi fits Windows (~12.5GiB) plus both 1000-file
          # workload passes (~17.4GiB each) with headroom.
          storageClassName: ocs-storagecluster-ceph-rbd-virtualization
          volumeMode: Block
  template:
    metadata:
      labels:
        cbt-demo: enabled
        app.kubernetes.io/managed-by: __MANAGED_BY_VALUE__
        virt-cbt-lab/run-id: __RUN_ID__
    spec:
      evictionStrategy: None
      # No nodeSelector: the root disk is network-attached Ceph RBD, so any
      # node can run the VM and the scheduler is free to spread load. The
      # previous d38-h18-000-r660 pin existed only to co-locate the VM with
      # the node-local cbt-demo-hpp pool for node-io-hog scenarios.
      domain:
        cpu:
          cores: 4
        memory:
          guest: 8Gi
        resources:
          requests:
            memory: 8Gi
        machine:
          type: q35
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: sata
            - name: sysprep
              cdrom:
                bus: sata
                readonly: true
          channels:
            - name: org.qemu.guest_agent.0
              channel:
                target:
                  name: org.qemu.guest_agent.0
                  type: virtio
          interfaces:
            - name: default
              masquerade: {}
              model: virtio
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: __DV_NAME__
        - name: sysprep
          sysprep:
            secret:
              name: __OOBE_SECRET__
