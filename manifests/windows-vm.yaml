apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __VM_NAME__
  namespace: __NAMESPACE__
  labels:
    cbt-demo: enabled
    app.kubernetes.io/managed-by: __MANAGED_BY_VALUE__
    virt-cbt-lab/run-id: __RUN_ID__
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: __DV_NAME__
        labels:
          app.kubernetes.io/managed-by: __MANAGED_BY_VALUE__
          virt-cbt-lab/run-id: __RUN_ID__
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
      spec:
        sourceRef:
          kind: DataSource
          name: windows-server-2022
          namespace: vm-cbt-images
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
          # HostPath pool (cbt-demo-hpp): the pool exists only on
          # d38-h18-000-r660 and backs /dev/sdb, the exact node/disk the
          # node-io-hog writes to. Ceph RBD left the VM's data path off the
          # node entirely, so a node-local I/O hog could not contend on the
          # copy (EXP-9 v1 was placement-INVALID for exactly that reason).
          storageClassName: cbt-demo-hpp
          volumeMode: Filesystem
  template:
    metadata:
      labels:
        cbt-demo: enabled
        app.kubernetes.io/managed-by: __MANAGED_BY_VALUE__
        virt-cbt-lab/run-id: __RUN_ID__
    spec:
      evictionStrategy: None
      # The cbt-demo-hpp pool (and its WaitForFirstConsumer provisioner
      # deployment hpp-pool-cbt-demo-pool-d38-h18-000-r660) exists only on
      # d38-h18-000-r660; the explicit selector makes the chaos driver's
      # post-setup placement guard fail closed instead of racing the
      # scheduler.
      nodeSelector:
        kubernetes.io/hostname: d38-h18-000-r660
      domain:
        cpu:
          cores: 4
        memory:
          guest: 8Gi
        resources:
          requests:
            memory: 8Gi
        machine:
          type: q35
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: sata
            - name: sysprep
              cdrom:
                bus: sata
                readonly: true
          channels:
            - name: org.qemu.guest_agent.0
              channel:
                target:
                  name: org.qemu.guest_agent.0
                  type: virtio
          interfaces:
            - name: default
              masquerade: {}
              model: virtio
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: __DV_NAME__
        - name: sysprep
          sysprep:
            secret:
              name: __OOBE_SECRET__
